<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f8f6" />
    <meta name="description" content="Celestial Ephemeris - a contemplative tool for the I Ching and Rudolf Steiner's Calendar of the Soul." />
    <meta name="keywords" content="I Ching, Rudolf Steiner, Calendar of the Soul, Celestial Ephemeris, contemplation" />

    <meta property="og:title" content="Celestial Ephemeris" />
    <meta property="og:description" content="A contemplative tool for the I Ching and Rudolf Steiner's Calendar of the Soul." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <title>Celestial Ephemeris</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-warm-gray-50 text-ray-dark dark:bg-ray-dark dark:text-warm-gray-100 transition-colors duration-300 font-body min-h-screen opacity-0 transition-opacity duration-700">
    <div id="root"></div>

    <script>
      document.fonts.ready.then(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      });

      setTimeout(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      }, 1500);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
