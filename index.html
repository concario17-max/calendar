<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SimSang Calendar</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Gowun+Batang:wght@400;700&family=Inter:wght@100..900&family=Noto+Serif+KR:wght@200..900&display=block">

    <!-- Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-warm-gray-50 text-ray-dark dark:bg-ray-dark dark:text-warm-gray-100 transition-colors duration-300 font-display min-h-screen opacity-0 transition-opacity duration-700">
    <div id="root"></div>
    
    <script>
      // 폰트가 로드될 때까지 기다렸다가 서서히 노출 (Ray's Premium Reveal)
      document.fonts.ready.then(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      });
      // 폰트 로드 실패 시에도 대비 (Safety Fallback)
      setTimeout(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      }, 1500);
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
