<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Celestial Ephemeris - a contemplative tool for the I Ching and Rudolf Steiner's Calendar of the Soul." />
    <meta name="keywords" content="I Ching, Rudolf Steiner, Calendar of the Soul, Celestial Ephemeris, contemplation" />

    <meta property="og:title" content="Celestial Ephemeris" />
    <meta property="og:description" content="A contemplative tool for the I Ching and Rudolf Steiner's Calendar of the Soul." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <title>Celestial Ephemeris</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Inter:wght@100..900&display=block">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-warm-gray-50 text-ray-dark dark:bg-ray-dark dark:text-warm-gray-100 transition-colors duration-300 font-display min-h-screen opacity-0 transition-opacity duration-700">
    <div id="root"></div>

    <script>
      document.fonts.ready.then(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      });

      setTimeout(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      }, 1500);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
