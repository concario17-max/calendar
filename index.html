<!doctype html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="심상 달력 - 역경과 영혼의 달력을 위한 사색 도구." />
    <meta name="keywords" content="역경, 영혼의 달력, 심상 달력, 명상, 사색" />

    <meta property="og:title" content="심상 달력" />
    <meta property="og:description" content="역경과 영혼의 달력을 위한 사색 도구." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <title>심상 달력</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Inter:wght@100..900&display=block">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body class="bg-warm-gray-50 text-ray-dark dark:bg-ray-dark dark:text-warm-gray-100 transition-colors duration-300 font-display min-h-screen opacity-0 transition-opacity duration-700">
    <div id="root"></div>

    <script>
      // Fade the app in after fonts load for a smoother first paint.
      document.fonts.ready.then(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      });

      // Fallback in case the font-loading promise stalls.
      setTimeout(() => {
        document.body.classList.remove('opacity-0');
        document.body.classList.add('opacity-100');
      }, 1500);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
